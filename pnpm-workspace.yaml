# Root-only workspace (omit `packages` → root package only).
# https://pnpm.io/pnpm-workspace_yaml

# Wait 24h after publish before resolving a version (supply-chain hardening).
minimumReleaseAge: 1440
# Allow EAS/CI to fall back when a range has no version old enough yet.
minimumReleaseAgeStrict: false

# Metro / React Native expect a flat node_modules layout.
nodeLinker: hoisted

# EAS/Linux may pull deps with install scripts not listed below; warn instead of fail.
strictDepBuilds: false

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  postcss: ^8.5.10
  "@tootallnate/once": ^3.0.1
  uuid: ^11.1.1
